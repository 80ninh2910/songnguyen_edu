name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    env:
      DATABASE_URL: postgresql://sne:ci@localhost:5432/sne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=critical

  frontend-main:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/main/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=critical

  frontend-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin/next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/admin/next-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=critical

  containers:
    runs-on: ubuntu-latest
    needs: [api, frontend-main, frontend-admin]
    env:
      POSTGRES_USER: sne
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: sne
      JWT_SECRET: ci-jwt-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      FRONTEND_URL: https://songnguyen.edu.vn
      ADMIN_URL: https://admin.songnguyen.edu.vn
      NEXT_PUBLIC_API_BASE_URL: https://api.songnguyen.edu.vn/api/v1
      NEXT_PUBLIC_ADMIN_API_BASE_URL: https://api.songnguyen.edu.vn/api/v1
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build migrate api frontend-main frontend-admin
